<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>devShark sandbox</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #17272e;
        background: #fbfaf6;
        padding: 16px;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #eef3f5; background: #0f1b20; }
      }
      button, input, select, textarea { font: inherit; }
      button { min-height: 32px; padding: 4px 12px; margin: 2px; }
      input, select { min-height: 32px; padding: 4px 8px; margin: 2px; }
      main, section { max-width: 720px; }
      #root:empty::before { content: "Nothing rendered yet."; opacity: 0.6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
