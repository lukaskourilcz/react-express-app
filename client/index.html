<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Playful display + friendly body type for the StudyShark look. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyShark — learn and test yourself across Web Dev, Geography, Math, History and Chess. Roadmaps, quizzes and leaderboards for every subject." />
    <meta name="theme-color" content="#2d7a2d" />
    <meta name="apple-mobile-web-app-title" content="StudyShark" />
    <meta property="og:title" content="StudyShark — Learn anything, level by level" />
    <meta property="og:description" content="Pick a subject — Web Dev, Geography, Math, History or Chess — and learn it as a level-by-level roadmap with quizzes and leaderboards." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyShark — Learn anything, level by level" />
    <meta name="twitter:description" content="Pick a subject — Web Dev, Geography, Math, History or Chess — and learn it as a level-by-level roadmap with quizzes and leaderboards." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Roboto: only the weights MUI's theme actually uses. The previous
         preload+stylesheet pair was redundant (preload-as-style without an
         onload handler doesn't apply the CSS) and shipped weight 300 that
         no component renders. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>StudyShark</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
