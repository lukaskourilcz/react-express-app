<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;display:flex;flex-direction:column;min-height:100%;font-family:'Inter',system-ui,sans-serif;color-scheme:{{ scheme }};color:light-dark(#132019,#e8eef0);overflow-x:auto">
  <header style="min-width:1024px;background:light-dark(rgba(255,255,255,.8),rgba(13,22,29,.8));backdrop-filter:blur(12px);border-bottom:1px solid light-dark(rgba(23,39,46,.08),rgba(232,238,240,.08))">
    <div style="max-width:1200px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 24px;min-height:56px;box-sizing:border-box">
      <a href="#" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;color:light-dark(#2d7a2d,#4caf50)">
        <img src="favicon.svg" alt="" width="22" height="22" style="display:block">
        <span style="font-family:'Manrope',sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;line-height:1">devShark</span>
      </a>
      <nav style="display:flex;justify-content:center;align-items:center;gap:4px;min-width:0;overflow:hidden">
        <sc-for list="{{ items }}" as="item" hint-placeholder-count="8">
          <a href="#" style="font-weight:{{ item.weight }};font-size:.875rem;white-space:nowrap;text-decoration:none;color:{{ item.color }};background:{{ item.bg }};padding:8px 12px;border-radius:10px">{{ item.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-shrink:0">
        <sc-if value="{{ showIcons }}" hint-placeholder-val="{{ true }}">
          <span style="display:inline-flex;align-items:center;gap:2px;color:light-dark(#4f6570,#9db3bc)">
            <span title="Leaderboard" style="display:grid;place-items:center;width:32px;height:32px;border-radius:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M5 4H3v2a3 3 0 0 0 3 3M19 4h2v2a3 3 0 0 1-3 3"></path></svg></span>
            <span title="Premium" style="display:grid;place-items:center;width:32px;height:32px;border-radius:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"></path><path d="M2 9h20M12 21 8 9l2-6M12 21l4-12-2-6"></path></svg></span>
            <span title="Rewards" style="display:grid;place-items:center;width:32px;height:32px;border-radius:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg></span>
          </span>
        </sc-if>
        <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
          <span style="display:inline-flex;align-items:center;height:56px"><span style="width:32px;height:32px;border-radius:50%;background:light-dark(#d6ded3,#3c4f43);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:light-dark(#132019,#e8eef0)">LK</span></span>
        </sc-if>
        <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ true }}">
          <span style="display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border:1px solid light-dark(rgba(23,39,46,.3),rgba(232,238,240,.28));border-radius:10px;font-weight:600;font-size:.875rem;background:light-dark(#fff,#101c24)">Log in</span>
        </sc-if>
      </div>
    </div>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;signedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;current&quot;,&quot;proposed&quot;],&quot;default&quot;:&quot;current&quot;,&quot;tsType&quot;:&quot;'current' | 'proposed'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const scheme = p.theme === 'dark' ? 'dark' : 'light';
    const dark = scheme === 'dark';
    const signedIn = !!p.signedIn;
    const all = [
      ['Today', '/today'], ['Quiz', '/quiz'], ['Learn', '/learn'], ['Challenge', '/challenge'], ['Play', '/play'],
      ['Collection', '/collection'], ['Coding', '/coding'], ['Roadmap', '/roadmap'],
    ];
    const proposed = signedIn
      ? [['Today', '/today'], ['Learn', '/learn'], ['Quiz', '/quiz'], ['Coding', '/coding'], ['Challenge', '/challenge'], ['Play', '/play'], ['Premium', '/premium']]
      : [['Learn', '/learn'], ['Quiz', '/quiz'], ['Coding', '/coding'], ['Challenge', '/challenge'], ['Play', '/play'], ['Premium', '/premium']];
    const src = p.variant === 'proposed' ? proposed : all;
    const active = p.active ?? '';
    const items = src.map(([label, to]) => {
      const on = active === to || (to !== '/' && active.startsWith(to + '/'));
      return {
        label, on,
        weight: on ? 700 : 500,
        color: on ? (dark ? '#4caf50' : '#236123') : (dark ? '#9db3bc' : '#4f6570'),
        bg: on ? 'rgba(45,122,45,.12)' : 'transparent',
      };
    });
    return { scheme, items, signedIn, signedOut: !signedIn, showIcons: p.variant !== 'proposed' };
  }
}
</script>
</body>
</html>
