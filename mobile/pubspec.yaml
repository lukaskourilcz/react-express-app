name: devquiz
description: DevQuiz mobile — test your web development skills.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_highlight: ^0.7.0
  url_launcher: ^6.3.1
  # Realtime broadcast channels for multiplayer / classroom matches.
  supabase_flutter: ^2.5.6
  # WebView for the code sandbox (JS / TS / Python via Pyodide).
  webview_flutter: ^4.10.0
  # Native Auth0 universal-login flow.
  auth0_flutter: ^1.7.1
  # Crash and error reporting. Init is conditional on SENTRY_DSN.
  sentry_flutter: ^8.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sandbox_runner.html
