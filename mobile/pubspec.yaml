name: devquiz
description: DevQuiz mobile — test your web development skills.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_highlight: ^0.7.0
  url_launcher: ^6.3.1
  # Optional native auth - if you don't want Auth0 yet, the app works in
  # guest mode and you can leave this dependency unused.
  auth0_flutter: ^1.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
