<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <style>
    body { margin: 0; padding: 0; background: #1a1a1a; color: #e5e5e5;
           font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; }
    #out { padding: 12px; white-space: pre-wrap; word-break: break-word; min-height: 100vh; box-sizing: border-box; }
    .err { color: #fca5a5; }
    .warn { color: #fcd34d; }
  </style>
</head>
<body>
  <div id="out"><span style="color:#888">Ready.</span></div>
  <script>
    const out = document.getElementById('out');
    let firstLog = true;
    function appendLog(level, line) {
      if (firstLog) { out.innerHTML = ''; firstLog = false; }
      const div = document.createElement('div');
      if (level === 'error') div.className = 'err';
      else if (level === 'warn') div.className = 'warn';
      div.textContent = line;
      out.appendChild(div);
    }
    function send(msg) {
      // Flutter side reads window.SandboxBridge messages
      try {
        if (window.SandboxBridge && window.SandboxBridge.postMessage) {
          window.SandboxBridge.postMessage(JSON.stringify(msg));
        }
      } catch (e) {}
    }

    function fmt(v) {
      if (v === undefined) return 'undefined';
      if (v === null) return 'null';
      if (typeof v === 'string') return v;
      if (typeof v === 'function') return v.toString();
      try { return JSON.stringify(v, (_, x) => typeof x === 'function' ? String(x) : x, 2); }
      catch (e) { return String(v); }
    }
    const wrap = (level) => function (...args) {
      const line = args.map(fmt).join(' ');
      appendLog(level, line);
      send({ type: 'log', level, line });
    };
    console.log = wrap('log');
    console.error = wrap('error');
    console.warn = wrap('warn');
    console.info = wrap('info');
    window.addEventListener('error', (e) => {
      const line = e.message || String(e);
      appendLog('error', line);
      send({ type: 'log', level: 'error', line });
    });
    window.addEventListener('unhandledrejection', (e) => {
      const line = 'Unhandled rejection: ' + (e.reason && e.reason.message || e.reason);
      appendLog('error', line);
      send({ type: 'log', level: 'error', line });
    });

    // Sucrase loader (cached in memory across runs).
    let sucraseLoading = null;
    let sucraseTransform = null;
    async function ensureSucrase() {
      if (sucraseTransform) return sucraseTransform;
      if (sucraseLoading) return sucraseLoading;
      sucraseLoading = (async () => {
        const resp = await fetch('https://cdn.jsdelivr.net/npm/sucrase@3.35.0/dist/sucrase.min.js');
        const code = await resp.text();
        const fn = new Function(code + '; return Sucrase || sucrase;');
        const Sucrase = fn();
        sucraseTransform = (input) => Sucrase.transform(input, { transforms: ['typescript', 'imports'] }).code;
        return sucraseTransform;
      })();
      return sucraseLoading;
    }

    let pyodide = null;
    let pyodideLoading = null;
    async function ensurePyodide() {
      if (pyodide) return pyodide;
      if (pyodideLoading) return pyodideLoading;
      send({ type: 'pyodide_loading' });
      pyodideLoading = (async () => {
        const tag = document.createElement('script');
        tag.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
        await new Promise((resolve, reject) => {
          tag.onload = resolve;
          tag.onerror = () => reject(new Error('Failed to load Pyodide'));
          document.head.appendChild(tag);
        });
        pyodide = await window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
        pyodide.setStdout({ batched: (line) => { appendLog('log', line); send({ type: 'log', level: 'log', line }); } });
        pyodide.setStderr({ batched: (line) => { appendLog('error', line); send({ type: 'log', level: 'error', line }); } });
        send({ type: 'pyodide_ready' });
        return pyodide;
      })();
      return pyodideLoading;
    }

    async function runJs(code) {
      firstLog = true;
      try {
        const fn = new Function(code);
        const result = fn();
        if (result !== undefined) {
          const line = '⇒ ' + fmt(result);
          appendLog('log', line);
          send({ type: 'log', level: 'log', line });
        }
      } catch (err) {
        appendLog('error', err.message || String(err));
        send({ type: 'log', level: 'error', line: err.message || String(err) });
      } finally {
        send({ type: 'done' });
      }
    }

    async function runTs(code) {
      firstLog = true;
      try {
        const transform = await ensureSucrase();
        const compiled = transform(code);
        await runJs(compiled);
      } catch (err) {
        appendLog('error', err.message || String(err));
        send({ type: 'log', level: 'error', line: err.message || String(err) });
        send({ type: 'done' });
      }
    }

    async function runPython(code) {
      firstLog = true;
      try {
        const py = await ensurePyodide();
        const result = await py.runPythonAsync(code);
        if (result !== undefined && result !== null) {
          const line = '⇒ ' + String(result);
          appendLog('log', line);
          send({ type: 'log', level: 'log', line });
        }
      } catch (err) {
        appendLog('error', err.message || String(err));
        send({ type: 'log', level: 'error', line: err.message || String(err) });
      } finally {
        send({ type: 'done' });
      }
    }

    // Flutter calls these via runJavaScript:
    window.runJs = runJs;
    window.runTs = runTs;
    window.runPython = runPython;
    send({ type: 'ready' });
  </script>
</body>
</html>
